[package]
name = "time"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "00_time"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
pollster = "1.0"

winit = "0.30"
wgpu = "30.0"
bytemuck = { version = "1.25", features = [ "derive" ] }
glam = "0.33"
image = {version = "0.25", features = ["png","jpeg"]}

# [profile.release]
# opt-level="s"
# debug=false
# lto="thin"
# panic="abort"
# codegen-units=1
# strip="symbols"
